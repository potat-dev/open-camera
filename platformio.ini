; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.f_cpu = 240000000L

board_build.flash_mode = qio
board_build.f_flash = 80000000L

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

board_build.psram_type = opi
board_build.psram_freq = 80000000L
board_build.arduino.memory_type = qio_opi ; QIO flash + OPI PSRAM

monitor_filters = esp32_exception_decoder, default

board_build.extra_flags = 
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3

build_type = debug
build_flags = -I include

; board_build.filesystem = littlefs

[env:server]
build_src_filter = +<server>
lib_deps = 
	esp32-camera

[env:display]
build_src_filter = +<display>
custom_component_remove = espressif/esp32-camera
lib_deps = 
	https://github.com/potat-dev/esp32-camera.git
	lovyan03/LovyanGFX
	gyverlibs/EncButton@^3.7.6
	; gyverlibs/StringUtils@^1.6.0
